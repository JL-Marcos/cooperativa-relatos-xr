<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cooperativa de Relatos — XR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- Cámara -->
        <a-camera position="0 1.6 4"></a-camera>

        <!-- Suelo -->
        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="10"
            height="10"
            color="#333333">
        </a-plane>

        <!-- Objeto de prueba -->
        <a-box
            position="0 1 -3"
            width="2"
            height="2"
            depth="2"
            color="#00ffff">
        </a-box>

        <!-- Luz -->
        <a-light
            type="ambient"
            intensity="1">
        </a-light>

    </a-scene>

</body>
</html>
